<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img" aria-labelledby="title desc">
  <title id="title">Example 1 initial tree</title>
  <desc id="desc">A path from node 0 to node 1 to node 2. Edges are labeled 0 and 1. Nodes 0 and 2 have initial color 0, and node 1 has initial color 1.</desc>
  <rect width="560" height="190" rx="18" fill="#f8fafc"/>
  <text x="280" y="30" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#334155">Initial colors · red = 0 · green = 1</text>
  <g stroke="#475569" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="104" x2="280" y2="104"/>
    <line x1="280" y1="104" x2="430" y2="104"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f172a">
    <rect x="193" y="69" width="24" height="22" rx="11" fill="#e2e8f0"/><text x="205" y="85" text-anchor="middle">0</text>
    <rect x="343" y="69" width="24" height="22" rx="11" fill="#e2e8f0"/><text x="355" y="85" text-anchor="middle">1</text>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">
    <circle cx="130" cy="104" r="34" fill="#dc2626" stroke="#991b1b" stroke-width="3"/><text x="130" y="111">0</text>
    <circle cx="280" cy="104" r="34" fill="#16a34a" stroke="#166534" stroke-width="3"/><text x="280" y="111">1</text>
    <circle cx="430" cy="104" r="34" fill="#dc2626" stroke="#991b1b" stroke-width="3"/><text x="430" y="111">2</text>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#475569" text-anchor="middle">
    <text x="130" y="158">node 0</text><text x="280" y="158">node 1</text><text x="430" y="158">node 2</text>
  </g>
</svg>
