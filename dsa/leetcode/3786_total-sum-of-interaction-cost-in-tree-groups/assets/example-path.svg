<svg xmlns="http://www.w3.org/2000/svg" width="600" height="130" viewBox="0 0 600 130" role="img" aria-labelledby="title desc">
  <title id="title">Three-node path</title><desc id="desc">Node 0 connects to node 1, which connects to node 2.</desc>
  <g stroke="currentColor" stroke-width="4" fill="none"><path d="M90 65H300M300 65H510"/></g>
  <g fill="#fff" stroke="#202124" stroke-width="4"><circle cx="90" cy="65" r="38"/><circle cx="300" cy="65" r="38"/><circle cx="510" cy="65" r="38"/></g>
  <g fill="#111" font-family="Arial,sans-serif" font-size="28" font-weight="600" text-anchor="middle" dominant-baseline="central"><text x="90" y="65">0</text><text x="300" y="65">1</text><text x="510" y="65">2</text></g>
</svg>
