<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Example 2 tree</title>
  <desc id="desc">Good node one connects to bad nodes zero and two and good node three; node three connects to good node four.</desc>
  <rect width="360" height="280" rx="12" fill="#f8fafc"/>
  <g stroke="#475569" stroke-width="4"><line x1="180" y1="65" x2="75" y2="135"/><line x1="180" y1="65" x2="285" y2="135"/><line x1="180" y1="65" x2="180" y2="155"/><line x1="180" y1="155" x2="180" y2="230"/></g>
  <g stroke="#fff" stroke-width="3"><circle cx="180" cy="65" r="25" fill="#238636"/><circle cx="75" cy="135" r="25" fill="#c93c37"/><circle cx="285" cy="135" r="25" fill="#c93c37"/><circle cx="180" cy="155" r="25" fill="#238636"/><circle cx="180" cy="230" r="25" fill="#238636"/></g>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="180" y="71">1</text><text x="75" y="141">0</text><text x="285" y="141">2</text><text x="180" y="161">3</text><text x="180" y="236">4</text></g>
</svg>
