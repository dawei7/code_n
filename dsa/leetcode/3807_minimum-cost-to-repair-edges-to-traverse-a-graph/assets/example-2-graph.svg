<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc"><title id="title">Example 2 weighted graph</title><desc id="desc">Six nodes and nine weighted edges. The two-edge route zero to one to five, with costs ten and twelve, is emphasized.</desc><g fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"><path d="M75 195L245 320L445 195L615 320L705 75"/><path d="M75 195L445 195M245 65L245 320M245 65L705 75M245 320L615 320"/></g><g fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"><path d="M75 195L245 65L705 75"/></g><g font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle"><g fill="#fff" stroke="#94a3b8"><rect x="137" y="242" width="36" height="26" rx="7"/><rect x="330" y="247" width="36" height="26" rx="7"/><rect x="516" y="243" width="36" height="26" rx="7"/><rect x="645" y="182" width="36" height="26" rx="7"/><rect x="137" y="112" width="42" height="26" rx="7"/><rect x="466" y="57" width="42" height="26" rx="7"/><rect x="332" y="169" width="36" height="26" rx="7"/><rect x="254" y="239" width="36" height="26" rx="7"/><rect x="411" y="307" width="42" height="26" rx="7"/></g><text x="155" y="260">5</text><text x="348" y="265">6</text><text x="534" y="261">7</text><text x="663" y="200">5</text><text x="158" y="130">10</text><text x="487" y="75">12</text><text x="350" y="187">9</text><text x="272" y="257">8</text><text x="432" y="325">11</text></g><g fill="#fff" stroke="#0f172a" stroke-width="4"><circle cx="75" cy="195" r="31"/><circle cx="245" cy="65" r="31"/><circle cx="245" cy="320" r="31"/><circle cx="445" cy="195" r="31"/><circle cx="615" cy="320" r="31"/><circle cx="705" cy="75" r="31"/></g><g font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central"><text x="75" y="195">0</text><text x="245" y="65">1</text><text x="245" y="320">2</text><text x="445" y="195">3</text><text x="615" y="320">4</text><text x="705" y="75">5</text></g></svg>
