<svg xmlns="http://www.w3.org/2000/svg" width="500" height="160" viewBox="0 0 500 160" role="img" aria-labelledby="title desc"><title id="title">Example 3 disconnected graph</title><desc id="desc">Nodes zero and one are joined by an edge of cost one. Destination node two is isolated.</desc><path d="M80 80L250 80" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><rect x="148" y="59" width="34" height="27" rx="7" fill="#fff" stroke="#94a3b8"/><text x="165" y="79">1</text></g><g fill="#fff" stroke="#0f172a" stroke-width="4"><circle cx="80" cy="80" r="31"/><circle cx="250" cy="80" r="31"/><circle cx="420" cy="80" r="31" stroke-dasharray="7 5"/></g><g font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central"><text x="80" y="80">0</text><text x="250" y="80">1</text><text x="420" y="80">2</text></g></svg>
