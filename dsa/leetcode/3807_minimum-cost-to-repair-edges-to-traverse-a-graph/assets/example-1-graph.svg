<svg xmlns="http://www.w3.org/2000/svg" width="430" height="230" viewBox="0 0 430 230" role="img" aria-labelledby="title desc"><title id="title">Example 1 weighted graph</title><desc id="desc">A triangle on nodes zero, one, and two. The direct edge from zero to two costs one hundred and is emphasized; the other two edges cost ten.</desc><g fill="none" stroke-linecap="round"><path d="M75 180L215 50L355 180" stroke="#64748b" stroke-width="4"/><path d="M75 180L355 180" stroke="#0f766e" stroke-width="7"/></g><g font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><g fill="#fff" stroke="#94a3b8"><rect x="126" y="96" width="42" height="28" rx="8"/><rect x="262" y="96" width="42" height="28" rx="8"/><rect x="190" y="165" width="50" height="28" rx="8"/></g><text x="147" y="116">10</text><text x="283" y="116">10</text><text x="215" y="185">100</text></g><g fill="#fff" stroke="#0f172a" stroke-width="4"><circle cx="75" cy="180" r="31"/><circle cx="215" cy="50" r="31"/><circle cx="355" cy="180" r="31"/></g><g font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="central"><text x="75" y="180">0</text><text x="215" y="50">1</text><text x="355" y="180">2</text></g></svg>
