<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" role="img" aria-labelledby="title desc">
  <title id="title">Example 1 binary search tree</title>
  <desc id="desc">Node 4 at level zero has right child 5 at level one. Node 5 has right child 7 at the requested level two.</desc>
  <rect width="520" height="310" rx="20" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7">
    <line x1="78" y1="66" x2="488" y2="66"/>
    <line x1="78" y1="154" x2="488" y2="154"/>
    <line x1="78" y1="242" x2="488" y2="242"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">
    <text x="66" y="71">level 0</text>
    <text x="66" y="159">level 1</text>
    <text x="66" y="247">level 2</text>
  </g>
  <g stroke="#334155" stroke-width="5" stroke-linecap="round">
    <line x1="185" y1="66" x2="280" y2="154"/>
    <line x1="280" y1="154" x2="375" y2="242"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="185" cy="66" r="31" fill="white" stroke="#334155" stroke-width="4"/><text x="185" y="74" fill="#0f172a">4</text>
    <circle cx="280" cy="154" r="31" fill="white" stroke="#334155" stroke-width="4"/><text x="280" y="162" fill="#0f172a">5</text>
    <circle cx="375" cy="242" r="33" fill="#0f766e" stroke="#115e59" stroke-width="4"/><text x="375" y="250" fill="white">7</text>
  </g>
  <text x="423" y="247" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f766e">target</text>
</svg>
