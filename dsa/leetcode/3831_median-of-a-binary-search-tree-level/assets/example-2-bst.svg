<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img" aria-labelledby="title desc">
  <title id="title">Example 2 binary search tree</title>
  <desc id="desc">Node 6 at level zero has children 3 and 8 at the requested level one. Both children are highlighted.</desc>
  <rect width="520" height="240" rx="20" fill="#f8fafc"/>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7">
    <line x1="78" y1="66" x2="488" y2="66"/>
    <line x1="78" y1="174" x2="488" y2="174"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="end">
    <text x="66" y="71">level 0</text>
    <text x="66" y="179">level 1</text>
  </g>
  <g stroke="#334155" stroke-width="5" stroke-linecap="round">
    <line x1="280" y1="66" x2="170" y2="174"/>
    <line x1="280" y1="66" x2="390" y2="174"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <circle cx="280" cy="66" r="31" fill="white" stroke="#334155" stroke-width="4"/><text x="280" y="74" fill="#0f172a">6</text>
    <circle cx="170" cy="174" r="33" fill="#0f766e" stroke="#115e59" stroke-width="4"/><text x="170" y="182" fill="white">3</text>
    <circle cx="390" cy="174" r="33" fill="#0f766e" stroke="#115e59" stroke-width="4"/><text x="390" y="182" fill="white">8</text>
  </g>
  <text x="476" y="179" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#0f766e" text-anchor="end">target values</text>
</svg>
