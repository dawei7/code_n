[tool.ruff]
# Keep algorithm sources compact without sacrificing scanability. Prefer a
# one-line signature when it fits; wrapping is reserved for genuinely long,
# usually multi-parameter signatures.
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Ignore E741 (Ambiguous variable name) since `l` and `r` are standard for indices in algorithm challenges.
# Ignore F841 (Unused variable) to avoid unsafe automatic removals.
ignore = ["E741", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests", "server/tests"]
norecursedirs = [".venv", "build", "dist", "electron/release", "server/dist"]
